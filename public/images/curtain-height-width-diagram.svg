<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc"><title id="title">Curtain height and width at a glance</title><desc id="desc">Curtain measurement example with a 60-inch window, an 80-inch rod extending 10 inches on each side, and the rod top 92 inches above the floor. A verified 2-inch hardware drop places the fabric top at 90 inches; an 89½-inch fabric length leaves half an inch above the floor.</desc><rect width="1600" height="1220" fill="#fbf8f1"/><text x="70" y="70" font-family="DejaVu Sans" font-size="43" text-anchor="start" fill="#30332b" font-weight="bold">Curtain height and width at a glance</text><text x="70" y="116" font-family="DejaVu Sans" font-size="28" text-anchor="start" fill="#30332b" font-weight="normal">One illustrative window. Measurements in inches.</text><line x1="335" y1="264" x2="1215" y2="264" stroke="#aaa798" stroke-width="3" /><text x="1225" y="273" font-family="DejaVu Sans" font-size="25" text-anchor="start" fill="#30332b" font-weight="normal">Ceiling</text><line x1="335" y1="840" x2="1215" y2="840" stroke="#aaa798" stroke-width="3" /><text x="1225" y="849" font-family="DejaVu Sans" font-size="25" text-anchor="start" fill="#30332b" font-weight="normal">Floor</text><rect x="570" y="360" width="360" height="300" fill="#edece4" stroke="#8b897b" stroke-width="3"/><rect x="582" y="372" width="336" height="276" fill="#f6f5ed" stroke="#8b897b" stroke-width="3"/><line x1="750" y1="372" x2="750" y2="648" stroke="#c3c2b6" stroke-width="3" /><line x1="582" y1="510" x2="918" y2="510" stroke="#c3c2b6" stroke-width="3" /><rect x="510" y="288" width="480" height="7" fill="#67674f" stroke="#67674f" stroke-width="1"/><circle cx="498" cy="291.5" r="9" fill="#67674f"/><circle cx="1002" cy="291.5" r="9" fill="#67674f"/><ellipse cx="519" cy="296" rx="5" ry="8" fill="none" stroke="#76755d" stroke-width="2"/><ellipse cx="532" cy="296" rx="5" ry="8" fill="none" stroke="#76755d" str
ke-width="2"/><line x1="890" y1="1060" x2="1060" y2="1060" stroke="#aaa798" stroke-width="3" /><line x1="1035" y1="1020" x2="1035" y2="1060" stroke="#697052" stroke-width="3" /><line x1="1035" y1="1020" x2="1028" y2="1031" stroke="#697052" stroke-width="3" /><line x1="1035" y1="1020" x2="1042" y2="1031" stroke="#697052" stroke-width="3" /><line x1="1035" y1="1060" x2="1028" y2="1049" stroke="#697052" stroke-width="3" /><line x1="1035" y1="1060" x2="1042" y2="1049" stroke="#697052" stroke-width="3" /><text x="1080" y="1015" font-family="DejaVu Sans" font-size="30" text-anchor="start" fill="#30332b" font-weight="bold">½ in</text><text x="1080" y="1051" font-family="DejaVu Sans" font-size="26" text-anchor="start" fill="#30332b" font-weight="normal">floor clearance</text><text x="70" y="1140" font-family="DejaVu Sans" font-size="27" text-anchor="start" fill="#30332b" font-weight="normal">Example width: two 80 in flat panels = 160 in total for an 80 in span.</text><text x="70" y="1181" font-family="DejaVu Sans" font-size="26" text-anchor="start" fill="#30332b" font-weight="normal">Custom or pre-pleated fullness may already be included.</text></svg>